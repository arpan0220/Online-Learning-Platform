<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Manage Courses | LearnHub
    </title>

    <link
        rel="stylesheet"
        href="../css/style.css">

</head>

<body>

<header class="site-header">

    <nav class="navbar container">

        <a
            href="../index.html"
            class="logo">

            Learn<span>Hub</span>

        </a>

        <div class="nav-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a
                href="courses.html"
                class="active">

                Courses

            </a>

            <a href="students.html">
                Students
            </a>

            <a href="payments.html">
                Payments
            </a>

            <button
                class="btn btn-small"
                id="logoutBtn">

                Logout

            </button>

        </div>

    </nav>

</header>


<main class="section">

    <div class="container">

        <div class="page-title-row">

            <div>

                <span class="eyebrow">
                    ADMIN
                </span>

                <h1>
                    Manage Courses
                </h1>

            </div>


            <button
                class="btn"
                id="addCourseBtn">

                + Add Course

            </button>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            Course
                        </th>

                        <th>
                            Category
                        </th>

                        <th>
                            Level
                        </th>

                        <th>
                            Price
                        </th>

                        <th>
                            Actions
                        </th>

                    </tr>

                </thead>


                <tbody id="courseTable">

                </tbody>

            </table>

        </div>

    </div>

</main>


<!-- COURSE MODAL -->

<div
    id="courseModal"
    class="modal hidden">

    <div class="modal-content">

        <button
            class="modal-close"
            id="closeCourseModal">

            ×

        </button>


        <h2 id="modalTitle">
            Add Course
        </h2>


        <form id="courseForm">

            <input
                type="hidden"
                id="courseId">


            <label>

                Course Title

                <input
                    type="text"
                    id="courseTitle"
                    required>

            </label>


            <label>

                Category

                <select id="courseCategory" required>

                    <option value="Programming">
                        Programming
                    </option>

                    <option value="Web Development">
                        Web Development
                    </option>

                    <option value="Database">
                        Database
                    </option>

                </select>

            </label>


            <label>

                Level

                <select id="courseLevel" required>

                    <option value="Beginner">
                        Beginner
                    </option>

                    <option value="Intermediate">
                        Intermediate
                    </option>

                    <option value="Advanced">
                        Advanced
                    </option>

                </select>

            </label>


            <label>

                Price

                <input
                    type="number"
                    id="coursePrice"
                    min="0"
                    required>

            </label>


            <label>

                Duration

                <input
                    type="text"
                    id="courseDuration"
                    placeholder="8 weeks"
                    required>

            </label>


            <label>

                Description

                <textarea
                    id="courseDescription"
                    rows="5"
                    required>
                </textarea>

            </label>


            <button
                type="submit"
                class="btn full">

                Save Course

            </button>

        </form>

    </div>

</div>


<script src="../js/main.js"></script>
<script src="../js/admin.js"></script>

</body>
</html>
