<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Payments | LearnHub
    </title>

    <link
        rel="stylesheet"
        href="../css/style.css">

</head>

<body>

<header class="site-header">

    <nav class="navbar container">

        <a
            href="../index.html"
            class="logo">

            Learn<span>Hub</span>

        </a>


        <div class="nav-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="courses.html">
                Courses
            </a>

            <a href="students.html">
                Students
            </a>

            <a
                href="payments.html"
                class="active">

                Payments

            </a>

            <button
                class="btn btn-small"
                id="logoutBtn">

                Logout

            </button>

        </div>

    </nav>

</header>


<main class="section">

    <div class="container">

        <div class="page-title-row">

            <div>

                <span class="eyebrow">
                    ADMIN
                </span>

                <h1>
                    Payment Management
                </h1>

            </div>


            <div class="revenue-box">

                Total Revenue:

                <strong id="paymentTotal">
                    ₹0
                </strong>

            </div>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            Student
                        </th>

                        <th>
                            Course
                        </th>

                        <th>
                            Amount
                        </th>

                        <th>
                            Date
                        </th>

                        <th>
                            Status
                        </th>

                    </tr>

                </thead>


                <tbody id="paymentTable">
                </tbody>

            </table>

        </div>

    </div>

</main>


<script src="../js/main.js"></script>
<script src="../js/admin.js"></script>

</body>
</html>
