<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Login | LearnHub
    </title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body class="auth-page">

<div class="auth-card">

    <a
        class="logo"
        href="index.html">

        Learn<span>Hub</span>

    </a>


    <h1>
        Welcome back
    </h1>

    <p>
        Sign in to continue learning.
    </p>


    <form id="loginForm">

        <label>

            Email

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required>

        </label>


        <label>

            Password

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required>

        </label>


        <label class="checkbox">

            <input
                type="checkbox"
                id="remember">

            Remember me

        </label>


        <button
            class="btn full"
            type="submit">

            Login

        </button>

    </form>

    <p>

        Don't have an account?

    <a href="index.html">

    </a>

</div>


<script src="js/main.js"></script>
<script src="js/auth.js"></script>

</body>

</html>
