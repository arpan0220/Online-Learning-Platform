<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        My Courses | LearnHub
    </title>

    <link
        rel="stylesheet"
        href="../css/style.css">

</head>

<body>

<header class="site-header">

    <nav class="navbar container">

        <a
            href="../index.html"
            class="logo">

            Learn<span>Hub</span>

        </a>


        <div class="nav-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a
                href="my-courses.html"
                class="active">

                My Courses

            </a>

            <a href="profile.html">
                Profile
            </a>

            <a href="../courses.html">
                Browse Courses
            </a>

            <button
                class="btn btn-small"
                id="logoutBtn">

                Logout

            </button>

        </div>

    </nav>

</header>


<main class="section">

    <div class="container">

        <div class="section-heading">

            <span class="eyebrow">
                MY LEARNING
            </span>

            <h1>
                My Courses
            </h1>

        </div>


        <div
            id="myCourses"
            class="course-grid">
        </div>


        <div
            id="myCoursesEmpty"
            class="empty hidden">

            <h3>
                No courses yet
            </h3>

            <p>
                Browse our courses and start learning.
            </p>

            <a
                href="../courses.html"
                class="btn">

                Browse Courses

            </a>

        </div>

    </div>

</main>


<script src="../js/main.js"></script>
<script src="../js/student.js"></script>
