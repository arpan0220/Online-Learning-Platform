<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Register | LearnHub
    </title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body class="auth-page">

<div class="auth-card">

    <a
        class="logo"
        href="index.html">

        Learn<span>Hub</span>

    </a>


    <h1>
        Create Account
    </h1>

    <p>
        Start your learning journey.
    </p>


    <form id="registerForm">

        <label>

            Full Name

            <input
                type="text"
                id="registerName"
                placeholder="Enter your name"
                required
                minlength="2">

        </label>


        <label>

            Email

            <input
                type="email"
                id="registerEmail"
                placeholder="Enter your email"
                required>

        </label>


        <label>

            Password

            <input
                type="password"
                id="registerPassword"
                placeholder="Minimum 6 characters"
                required
                minlength="6">

        </label>


        <label>

            Confirm Password

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm password"
                required>

        </label>


        <button
            class="btn full"
            type="submit">

            Create Account

        </button>

    </form>


    <p>

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </p>


    <a href="index.html">
        ← Back Home
    </a>

</div>


<script src="js/main.js"></script>
<script src="js/auth.js"></script>

</body>

</html>
